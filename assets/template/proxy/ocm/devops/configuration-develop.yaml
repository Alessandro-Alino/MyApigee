deployList:
  repeatableSets:
    - deploySet:
        label: sit
        conciergeCheck:
          environment: sit
          artifact:
            repositoryPath: ocm-generic-group/apigee/OCM/${repo}/${version}/${proxyArchive}
            name: ${proxyArchive}
            version: ${version}
        install:
          tool:
            apiProxy:
              organizations:
                - {gcpSIT}
              name: ${proxyName}